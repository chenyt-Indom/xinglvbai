# 行旅白 Nginx 反向代理配置（HTTPS）
# 域名: lvbaixing.top
# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name lvbaixing.top www.lvbaixing.top 139.199.69.88;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lvbaixing.top www.lvbaixing.top 139.199.69.88;

    ssl_certificate /etc/letsencrypt/live/lvbaixing.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lvbaixing.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    # Gzip 压缩（减少移动端传输量，172KB→约30KB）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 后端 API 代理（行程生成最长需要10分钟，超时设为600s）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Web 预览页（禁用缓存，防止手机浏览器缓存旧版页面）
    location /app/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 禁用所有静态资源缓存（开发阶段，防止手机浏览器缓存旧版）
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # 首页重定向到 /app/
    location / {
        return 301 /app/;
    }
}