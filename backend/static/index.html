function renderSlot(title, cls, slot, dayIdx, slotIdx){
  if(!slot) return '';
  // 优先使用后端AI生成的time_slot（如"9:00-11:30"），fallback到前端计算
  var timeRange = slot.time_slot || '';
  if (!timeRange && slot.duration) {
    const slotStartTimes = {morning: '9:00', afternoon: '13:00', evening: '18:00'};
    const durMatch = slot.duration.match(/(\d+(?:\.\d+)?)\s*小时/);
    if (durMatch) {
      const hours = parseFloat(durMatch[1]);
      const startTime = slotStartTimes[cls] || '9:00';
      const [sh, sm] = startTime.split(':').map(Number);
      const totalMin = sh * 60 + sm + Math.round(hours * 60);
      let eh = Math.floor(totalMin / 60);
      const em = totalMin % 60;
      if (eh >= 24) {
        let nextDayHour = eh % 24;
        timeRange = startTime + ' - 次日' + String(nextDayHour).padStart(2,'0') + ':' + String(em).padStart(2,'0');
      } else {
        timeRange = startTime + ' - ' + String(eh).padStart(2,'0') + ':' + String(em).padStart(2,'0');
      }
    }
  }
  const spotName = slot.spot||'';
  const imgUrl = slot.image || '';
  const escName = spotName.replace(/'/g,"\\'");
  const escImgUrl = imgUrl.replace(/'/g,"\\'");
  const escReason = (slot.reason||'').replace(/'/g,"\\'");
  const escRouteDetail = (slot.route_detail||'').replace(/'/g,"\\'");
  const clickHandler = imgUrl
    ? `onclick="showSpotDetail('${escName}','${escImgUrl}','${escReason}','${slot.location||''}','${slot.duration||''}',${slot.need_booking||false},'${escRouteDetail}','${timeRange}',${dayIdx},${slotIdx})"`
    : `onclick="showSpotDetail('${escName}','','${escReason}','${slot.location||''}','${slot.duration||''}',${slot.need_booking||false},'${escRouteDetail}','${timeRange}',${dayIdx},${slotIdx})"`;
  const imgHtml = imgUrl
    ? `<img class="spot-img" src="${imgUrl}" alt="${escName}" onerror="imgFallback(this,'spot','${escName}',this.onclick)" ${clickHandler}>`
    : `<div class="spot-placeholder" ${clickHandler}><div class="ph-spot-name">${escName}</div><div class="ph-hint">暂无真实照片</div></div>`;
  // 推荐游览路线（在图片下方展示）
  const routes = slot.recommended_routes;
  let routesHtml = '';
  if (routes && Array.isArray(routes) && routes.length > 0) {
    const rid = 'rr_' + dayIdx + '_' + slotIdx;
    routesHtml = `<div class="recommend-routes">
      <div class="recommend-routes-header" onclick="var b=document.getElementById('${rid}');var a=this.querySelector('.rr-arrow');b.classList.toggle('show');a.classList.toggle('open')">
        <span>🗺️</span><span>推荐游览路线</span><span class="rr-arrow">▶</span>
      </div>
      <div class="recommend-routes-body" id="${rid}">`;
    routes.forEach((r, ri) => {
      routesHtml += `<div class="recommend-routes-item"><span class="rr-num">${ri+1}</span><span class="rr-text">${r}</span></div>`;
    });
    routesHtml += '</div></div>';
  }
  return `<div class="time-slot">
    <div class="slot-header"><div class="slot-dot ${cls}"></div><span class="slot-title">${title}</span>${slot.location ? `<span class="map-pin" onclick="openAmapLink('${escName}','${slot.location}')">📍</span>` : ''}</div>
    ${imgHtml}
    ${routesHtml}
    <div class="spot-name">${spotName}</div>
    ${timeRange ? `<div class="spot-time-range"><span class="sr-icon">🕐</span>${timeRange}</div>` : ''}
    ${slot.duration ? `<span class="meta-tag">时长：${slot.duration}</span>` : ''}
    ${slot.need_booking ? '<span class="meta-tag booking">⚠需预约</span>' : ''}
    ${slot.location ? `<div class="spot-coord"><span class="coord-icon">📌</span>坐标：${slot.location}</div>` : ''}
    ${slot.route_detail ? `<div class="route-detail"><span class="route-icon">🗺️</span>游玩路线：${slot.route_detail}</div>` : ''}
    <div class="spot-reason">推荐理由：${slot.reason||''}</div>
  </div>`;
}

function openDayAmap(dayIdx){
  if(!tripData || !tripData.itinerary) return;
  const day = tripData.itinerary[dayIdx];
  if(!day) return;
  const spots = [];
  ['morning','afternoon','evening'].forEach(slot => {
    const s = day[slot];
    if(s && s.spot && s.location){
      const [lng, lat] = s.location.split(',').map(Number);
      if (!isNaN(lng) && !isNaN(lat)) spots.push({ name: s.spot, location: s.location, lng, lat });
    }
  });
  if(spots.length === 0) { alert('该天暂无景点坐标'); return; }

  document.getElementById('mapDialogTitle').textContent = (day.date||'Day'+day.day)+' 景点路线';
  document.getElementById('mapOverlay').classList.add('show');

  // 初始化弹窗地图
  setTimeout(() => {
    if (typeof AMap === 'undefined') { console.warn('高德地图 SDK 未加载'); return; }
    const container = document.getElementById('dayMapContainer');
    if (!container) return;
    if (dayMap) { dayMap.destroy(); dayMap = null; }

    const centerLng = spots.reduce((s,m) => s + m.lng, 0) / spots.length;
    const centerLat = spots.reduce((s,m) => s + m.lat, 0) / spots.length;

    dayMap = new AMap.Map('dayMapContainer', {
      center: [centerLng, centerLat],
      zoom: spots.length > 1 ? 12 : 14,
      resizeEnable: true,
    });

    spots.forEach((s, i) => {
      const content = `<div style="background:#4A90D9;color:#fff;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-size:12px;font-weight:700">${i+1}</div>`;
      const marker = new AMap.Marker({
        position: [s.lng, s.lat],
        content: content,
        offset: new AMap.Pixel(-12, -12),
        title: s.name,
      });
      marker.setMap(dayMap);
      marker.on('click', () => {
        const info = new AMap.InfoWindow({
          content: `<div style="padding:4px 8px;font-size:13px"><b>${i+1}. ${s.name}</b></div>`,
          offset: new AMap.Pixel(0, -32),
        });
        info.open(dayMap, [s.lng, s.lat]);
      });
    });

    if (spots.length > 1) dayMap.setFitView(null, false, [40, 40, 40, 40]);
  }, 200);

  // 构建景点列表
  let html = '';
  spots.forEach((s, i) => {
    html += `<div class="map-spot-item"><span class="map-spot-num">${i+1}</span><div class="map-spot-info"><span class="map-spot-name">${s.name}</span><span class="map-spot-loc">坐标：${s.location}</span></div></div>`;
  });
  document.getElementById('daySpotList').innerHTML = html;
}

function shareTrip(event){
  if(!tripData) return;
  // 生成专属分享链接
  var btn = event && event.target ? event.target : document.querySelector('.btn-share');
  if (btn) { btn.textContent = '⏳ 生成分享链接...'; btn.disabled = true; }
  fetch(API + '/api/share-trip', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({trip_data: tripData})
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    if (btn) { btn.textContent = '📤 分享行程'; btn.disabled = false; }
    if (data.success) {
      // 复制链接到剪贴板，并显示分享卡片
      if (navigator.clipboard) {
        navigator.clipboard.writeText(data.share_url).then(function() {
          showShareCard(data.share_url);
        }).catch(function() {
          showShareCard(data.share_url);
        });
      } else {
        showShareCard(data.share_url);
      }
    } else {
      showToast('分享失败：' + (data.error || '未知错误'));
    }
  })
  .catch(function(e) {
    if (btn) { btn.textContent = '📤 分享行程'; btn.disabled = false; }
    showToast('分享失败，请检查网络后重试');
  });
}

// 景点详情卡片（AI生成文本介绍 + 直接使用槽位已有图片）

async function showSpotDetail(name, image, reason, location, duration, need_booking, route_detail, timeRange, dayIdx, slotIdx) {
  const card = document.getElementById('detailCard');
  const overlay = document.getElementById('detailOverlay');
  const dest = tripData ? tripData.destination : '';
  const cacheKey = `spot_detail_${name}_${dest}`;
  // 显示加载动画
  card.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px"><div class="ai-loading"><span></span><span></span><span></span></div><div style="font-size:16px;color:#4A90D9;font-weight:500">AI正在生成详细介绍</div><div style="font-size:13px;color:#999">正在生成${name}介绍…</div></div>`;
  overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
  // 直接使用槽位已有图片，不走额外API请求
  const finalImage = image || '';
  // 获取文本介绍（带缓存）
  const cached = localStorage.getItem(cacheKey);
  let content = '', fromCache = false;
  if (cached) {
    try { const parsed = JSON.parse(cached); if (parsed.content) { content = parsed.content; fromCache = true; } } catch(e) {}
  }
  if (!fromCache) {
    try {
      const params = new URLSearchParams({name, city: dest, reason, route_detail});
      const res = await fetch(`${API}/api/spot-detail?${params}`);
      const data = await res.json();
      content = data.content || reason;
      localStorage.setItem(cacheKey, JSON.stringify({content, time: Date.now()}));
    } catch(e) { content = reason || `${name}是${dest}的著名景点。`; }
  }
  // 路线规划
  let routeInfo = '';
  let recommendedRoutes = [];
  if (dayIdx !== undefined && slotIdx !== undefined && tripData && tripData.itinerary) {
    const day = tripData.itinerary[dayIdx];
    if (day) {
      const slots = ['morning', 'afternoon', 'evening'];
      const slot = day[slots[slotIdx]];
      if (slot && slot.recommended_routes) {
        recommendedRoutes = slot.recommended_routes;
      }
      let prevSpot = null;
      for (let i = slotIdx - 1; i >= 0; i--) {
        const s = day[slots[i]];
        if (s && s.spot && s.location) { prevSpot = s; break; }
      }
      if (prevSpot && location) {
        const [plng, plat] = prevSpot.location.split(',').map(Number);
        const [clng, clat] = location.split(',').map(Number);
        if (!isNaN(plng) && !isNaN(plat) && !isNaN(clng) && !isNaN(clat)) {
          try {
            const res = await fetch(API + '/api/route-plan', {
              method: 'POST', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({spots: [{name: prevSpot.spot, lng: plng, lat: plat}, {name, lng: clng, lat: clat}]})
            });
            const data = await res.json();
            if (data.success && data.routes && data.routes[0] && data.routes[0].duration) {
              const r = data.routes[0];
              const trafficMap = {'畅通':'green','缓行':'orange','拥堵':'red'};
              routeInfo = `<div class="route-info"><span class="ri-icon">🚗</span>从「${prevSpot.spot}」出发：${r.distance}，约${r.duration}分钟 <span class="ri-traffic ${trafficMap[r.traffic]||'green'}">${r.traffic}</span></div>`;
            }
          } catch(e) {}
        }
      }
    }
  }
  renderDetailCard(card, 'spot', {name, image: finalImage, duration, need_booking, route_detail, timeRange, location, content, cacheKey, fromCache, dest, reason, routeInfo,
    recommended_routes: recommendedRoutes});
  document.body.style.overflow = '';
}

// 统一渲染详情卡片
function renderDetailCard(card, type, opts) {
  const {name, image, duration, need_booking, route_detail, timeRange, location, content, cacheKey, fromCache, area, price, stay_days, routeInfo, recommended_routes} = opts;
  let html = '';
  // 确保图片src永不为空，天气用text_to_image兜底，景点/酒店用占位提示
  const imgSrc = image || (type === 'weather' ? getFallbackImgUrl(name, 'weather') : '');
  const escapedName = name.replace(/'/g, "\\'");
  if (imgSrc) {
    html += `<img class="detail-img" src="${imgSrc}" alt="${name}" onerror="imgFallback(this,'${type}','${escapedName}')">`;
  } else {
    html += `<div class="detail-placeholder"><div class="ph-detail-name">${name}</div><div class="ph-detail-hint">暂无真实照片</div></div>`;
  }
  html += `<div class="detail-body">
    <div class="detail-title">${type==='hotel'?'🏨 ':''}${name}</div>
    <div class="detail-meta">`;
  if (type === 'spot') {
    if (timeRange) html += `<span class="detail-meta-tag">🕐 ${timeRange}</span>`;
    else if (duration) html += `<span class="detail-meta-tag">⏱ ${duration}</span>`;
    if (need_booking) html += '<span class="detail-meta-tag warn">⚠ 需提前预约</span>';
  } else {
    if (area) html += `<span class="detail-meta-tag">📍 ${area}</span>`;
    if (price) html += `<span class="detail-meta-tag" style="color:#E67E22">💰 ${price}</span>`;
    if (stay_days) html += `<span class="detail-meta-tag">📅 ${stay_days}</span>`;
  }
  html += `</div>`;
  if (routeInfo) html += routeInfo;
  if (route_detail) html += `<div class="detail-section"><div class="detail-section-title">🗺️ 游玩路线</div><div class="detail-section-text">${route_detail}</div></div>`;
  if (recommended_routes && Array.isArray(recommended_routes) && recommended_routes.length > 0) {
    html += `<div class="detail-section"><div class="detail-section-title">🗺️ 推荐游览路线</div>`;
    recommended_routes.forEach((r, i) => {
      html += `<div class="detail-route-item"><span class="rr-num-detail">${i+1}</span>${r}</div>`;
    });
    html += `</div>`;
  }
  html += `<div class="detail-section" style="margin-top:12px"><div class="detail-section-title">📖 详细介绍${fromCache?' <span style="font-size:12px;color:#52C41A">(已缓存)</span>':''}</div><div class="detail-long-text">${content.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>')}</div></div>`;
  if (location) html += `<div class="detail-section"><div class="detail-section-title">📍 坐标位置</div><div class="detail-section-text">${location}</div></div>`;
  html += `<button class="btn-regenerate" onclick="regenerateDetail('${cacheKey}','${type}','${name.replace(/'/g,"\\'")}')">🔄 重新生成介绍</button>`;
  html += `<button class="detail-close" onclick="closeDetail()">关闭</button></div>`;
  card.innerHTML = html;
}

// 重新生成详情介绍（同时刷新图片）
async function regenerateDetail(cacheKey, type, name) {
  const card = document.getElementById('detailCard');
  localStorage.removeItem(cacheKey);
  const btn = card.querySelector('.btn-regenerate');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 重新生成中...'; }
  const dest = tripData ? tripData.destination : '';
  const endpoint = type === 'spot' ? '/api/spot-detail' : '/api/hotel-detail';
  try {
    // 并行：刷新文本 + 刷新图片
    const params = new URLSearchParams({name, city: dest});
    const [textRes, imgRes] = await Promise.all([
      fetch(`${API}${endpoint}?${params}`),
      fetch(`${API}/api/spot-images?query=${encodeURIComponent(name + ' ' + dest)}&limit=1`)
    ]);
    const textData = await textRes.json();
    const content = textData.content || '';
    localStorage.setItem(cacheKey, JSON.stringify({content, time: Date.now()}));
    // 更新卡片内容
    const textDiv = card.querySelector('.detail-long-text');
    if (textDiv) textDiv.innerHTML = '<p>' + content.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>') + '</p>';
    const titleDiv = card.querySelector('.detail-section-title');
    if (titleDiv && titleDiv.textContent.includes('详细介绍')) titleDiv.textContent = '📖 详细介绍 (已更新)';
    // 刷新图片
    try {
      const imgData = await imgRes.json();
      const imgEl = card.querySelector('.detail-img');
      if (imgData.success && imgData.images && imgData.images.length > 0 && imgEl) {
        imgEl.src = imgData.images[0].url;
        imgEl.onerror = function() { imgFallback(this, type, name); };
      }
    } catch(e) {}
    if (btn) { btn.textContent = '✅ 已重新生成'; btn.style.color = '#52C41A'; btn.style.borderColor = '#52C41A'; }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 重新生成介绍'; }
  }
}

    if (cur.temp) {
      html += `<div class="wh-current">
        <div class="wh-current-main">
          <div class="wh-current-temp">${cur.temp}</div>
          <div class="wh-current-desc">${getEmoji(cur.weather)} ${cur.weather}</div>
        </div>
        <div class="wh-current-detail">
          ${cur.feels_like ? `<div class="wh-detail-item"><span>体感</span><span class="wh-detail-val">${cur.feels_like}</span></div>` : ''}
          ${cur.humidity ? `<div class="wh-detail-item"><span>湿度</span><span class="wh-detail-val">${cur.humidity}</span></div>` : ''}
          ${cur.wind ? `<div class="wh-detail-item"><span>风力</span><span class="wh-detail-val">${cur.wind.split(' ')[0]||''}</span></div>` : ''}
          ${cur.uv ? `<div class="wh-detail-item"><span>紫外线</span><span class="wh-detail-val">${cur.uv}</span></div>` : ''}
          ${cur.visibility ? `<div class="wh-detail-item"><span>能见度</span><span class="wh-detail-val">${cur.visibility}</span></div>` : ''}
        </div>
      </div>`;
    }

    // 空气质量指数（中国天气智能体）
    if (aqiData.success && aqiData.aqi) {
      html += `<div class="wh-aqi" style="background:${aqiData.color}15;border:1px solid ${aqiData.color}40">
        <div class="wh-aqi-value" style="color:${aqiData.color}">${aqiData.aqi}</div>
        <div class="wh-aqi-info">
          <div class="wh-aqi-level" style="color:${aqiData.color}">空气${aqiData.level}</div>
          <div class="wh-aqi-desc">${aqiData.description}</div>
          <div class="wh-aqi-detail">
            ${aqiData.pm25 ? `<span>PM2.5 ${aqiData.pm25}</span>` : ''}
            ${aqiData.pm10 ? `<span>PM10 ${aqiData.pm10}</span>` : ''}
          </div>
        </div>
      </div>`;
    }

    // 极端天气预警
    if (data.extreme_alert && data.extreme_alert.has_alert) {
      html += '<div class="wh-alert-bar">';
      data.extreme_alert.alerts.forEach(a => {
        const bg = a.level === 'danger' ? '#FFE0E0' : '#FFF3E0';
        const color = a.level === 'danger' ? '#D32F2F' : '#E67E22';
        html += `<div style="background:${bg};color:${color};padding:6px 12px;border-radius:6px;font-size:14px;margin-bottom:4px">⚠️ ${a.message}</div>`;
      });
      html += '</div>';
    }

    // 官方天气预警
    if (data.alerts && data.alerts.length) {
      html += '<div class="wh-alert-bar">';
      data.alerts.forEach(a => {
        html += `<div style="background:#FFE0E0;color:#D32F2F;padding:6px 12px;border-radius:6px;font-size:14px;margin-bottom:4px">🚨 ${a.headline||a.event||'天气预警'}</div>`;
      });
      html += '</div>';
    }

    // 逐时天气网格（3小时间隔）
    html += '<div class="wh-grid">';
    (data.hours||[]).forEach(h => {
      const hNum = parseInt(h.time);
      const isNow = hNum === currentHour || hNum === currentHour - 1 || hNum === currentHour - 2;
      html += `<div class="wh-item${isNow ? ' now' : ''}">
        <div class="wh-time">${h.time}${isNow ? ' 现在' : ''}</div>
        <div class="wh-emoji">${getEmoji(h.weather)}</div>
        <div class="wh-temp">${h.temp}</div>
        ${h.rain_chance && parseInt(h.rain_chance) > 30 ? `<div class="wh-rain">🌧️${h.rain_chance}</div>` : ''}
        ${h.wind ? `<div class="wh-wind">💨${h.wind.split(' ')[0]||''}</div>` : ''}
      </div>`;
    });
    html += '</div>';

    // 雨雪到来前1小时提醒
    let rainAlert = null;
    for (let i = 0; i < (data.hours||[]).length; i++) {
      const h = data.hours[i];
      const w = (h.weather||'').toLowerCase();
      if ((w.includes('rain') || w.includes('snow') || w.includes('雨') || w.includes('雪')) && parseInt(h.rain_chance) > 50) {
        const hNum = parseInt(h.time);
        if (hNum - currentHour > 0 && hNum - currentHour <= 2) {
          rainAlert = `预计${h.time}左右将有${h.weather}，请提前做好准备`;
          break;
        }
      }
    }
    if (rainAlert) {
      html += `<div class="wh-rain-alert">⏰ ${rainAlert}</div>`;
    }

    // AI天气助手按钮
    html += `<button class="wh-ai-btn" onclick="askWeatherAI('${dest.replace(/'/g,"\\'")}')" id="whAiBtn">🤖 问问中国天气智能体</button>`;
    html += `<div class="wh-ai-loading" id="whAiLoading">⏳ AI正在分析天气...</div>`;
    html += `<div class="wh-ai-reply" id="whAiReply"></div>`;

    html += '<button class="wh-close" onclick="closeWeatherHourly()">关闭</button>';
    card.innerHTML = html;
  } catch(e) {
    card.innerHTML = '<div style="text-align:center;padding:40px;color:#999">加载失败，请重试</div><button class="wh-close" onclick="closeWeatherHourly()">关闭</button>';
  }
}

// AI天气助手对话
async function askWeatherAI(city) {
  const btn = document.getElementById('whAiBtn');
  const loading = document.getElementById('whAiLoading');
  const reply = document.getElementById('whAiReply');
  if (!btn || !loading || !reply) return;
  btn.disabled = true;
  btn.textContent = '⏳ 分析中...';
  loading.classList.add('show');
  reply.classList.remove('show');
  try {
    const res = await fetch(API + `/api/china-weather/chat?city=${encodeURIComponent(city)}&query=${encodeURIComponent('出行建议')}`);
    const data = await res.json();
    if (data.reply) {
      reply.textContent = '💡 ' + data.reply;
      reply.classList.add('show');
    }
  } catch(e) {
    reply.textContent = '天气助手暂时不可用，请稍后重试';
    reply.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = '🤖 问问中国天气智能体';
    loading.classList.remove('show');
  }
}

// 雨雪来临前1小时提醒（需要逐时数据支持）
async function checkRainSnowAlert() {
  if (!tripData || !tripData.destination || !tripData.itinerary) return;
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  // 查找今天是否有行程
  const todayDay = (tripData.itinerary||[]).find(d => d.date === todayStr);
  if (!todayDay) return;
  try {
    const res = await fetch(API + `/api/weather-hourly?city=${encodeURIComponent(tripData.destination)}&date=${encodeURIComponent(todayStr)}`);
    const data = await res.json();
    if (!data.success || !data.hours) return;
    const nowHour = today.getHours();
    // 检查接下来1-2小时是否有雨雪
    const rainSnow = ['雨','雪','暴雨','大雨','中雨','小雨','雷阵雨','暴雪','大雪','中雪','小雪'];
    const nextHour = data.hours.find(h => {
      const hh = parseInt(h.time);
      return hh >= nowHour && hh <= nowHour + 2 && rainSnow.some(r => h.weather.includes(r));
    });
    if (nextHour) {
      const bar = document.getElementById('alertBar');
      const msg = document.getElementById('alertMsg');
      msg.textContent = `🌧️ ${nextHour.time}左右将有${nextHour.weather}，请提前做好准备！`;
      if (nextHour.weather.includes('雪')) bar.className = 'alert-bar snow show';
      else bar.className = 'alert-bar show';
    }
  } catch(e) {}
}

async function regeneratePlan() {

// 更新总览地图标记（重新生成计划后）
function updateOverviewMarkers() {
  if (!tripData) return;
  allMarkers = [];
  let globalOrder = 1;
  (tripData.itinerary||[]).forEach(day => {
    ['morning','afternoon','evening'].forEach(slot => {
      const s = day[slot];
      if(s && s.spot && s.location){
        const [lng, lat] = s.location.split(',').map(Number);
        if (!isNaN(lng) && !isNaN(lat)) {
          allMarkers.push({ name: s.spot, lng, lat, order: globalOrder, day: day.day });
          globalOrder++;
        }
      }
    });
  });
  const bk = tripData.booking_info || {};
  (bk.hotels || []).forEach(h => {
    if (h.location) {
      const [lng, lat] = h.location.split(',').map(Number);
      if (!isNaN(lng) && !isNaN(lat)) {
        allMarkers.push({ name: h.name, lng, lat, order: globalOrder, day: 0, type: 'hotel' });
        globalOrder++;
      }
    }
  });
  (bk.tickets || []).forEach(t => {
    if (t.location && t.need_booking) {
      const [lng, lat] = t.location.split(',').map(Number);
      if (!isNaN(lng) && !isNaN(lat)) {
        allMarkers.push({ name: t.spot, lng, lat, order: globalOrder, day: 0, type: 'ticket' });
        globalOrder++;
      }
    }
  });
  // 如果总览页正在显示，刷新地图
  if (document.getElementById('overviewPage').style.display === 'flex') {
    initOverviewMap(allMarkers);
  }
}

// 实时监测
function toggleMonitor() {
  if (monitorTimer) { stopMonitor(); } else { startMonitor(); }
}
function startMonitor() {
  if (monitorStopped) return;
  const btn = document.getElementById('btnMonitor');
  btn.textContent = '监测中...';
  btn.style.background = '#E67E22';
  btn.style.color = '#fff';
  btn.style.borderColor = '#E67E22';
  monitorRejected = false;
  checkTripStatus();
  monitorTimer = setInterval(checkTripStatus, 300000);
}
function stopMonitor() {
  if (monitorTimer) { clearInterval(monitorTimer); monitorTimer = null; }
  const btn = document.getElementById('btnMonitor');
  btn.textContent = '开启实时监测';
  btn.style.background = '#fff';
  btn.style.color = '#4A90D9';
  btn.style.borderColor = '#4A90D9';
  document.getElementById('monitorNotification').classList.remove('show');
}
async function checkTripStatus() {
  if (!tripData || monitorStopped) return;
  try {
    let currentLocation = {};
    if (navigator.geolocation) {
      try {
        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {timeout: 5000, maximumAge: 300000});
        });
        currentLocation = {lng: pos.coords.longitude, lat: pos.coords.latitude};
      } catch (e) {}
    }
    const res = await fetch(API + '/api/monitor-trip', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({trip_data: tripData, current_location: currentLocation, rejected: monitorRejected})
    });
    const data = await res.json();
    if (data.success && data.has_alert && data.suggestion) {
      showMonitorNotification(data.alerts, data.suggestion);
    }
  } catch (e) {}
}
function showMonitorNotification(alerts, suggestion) {
  const notif = document.getElementById('monitorNotification');
  document.getElementById('monitorTitle').textContent = '⚠️ 突发情况提醒';
  let body = '';
  if (alerts) alerts.forEach(a => { body += '<div style="margin-bottom:4px">• ' + a.message + '</div>'; });
  body += '<div style="margin-top:8px;color:#4A90D9;font-weight:500">💡 建议：' + suggestion + '</div>';
  document.getElementById('monitorBody').innerHTML = body;
  notif.classList.add('show');
  notif._suggestion = suggestion;
}
function acceptMonitorSuggestion() {
  document.getElementById('monitorNotification').classList.remove('show');
  var notif = document.getElementById('monitorNotification');
  document.getElementById('newPlanInput').value = notif._suggestion || '';
  document.getElementById('newPlanInput').focus();
}
function rejectMonitorSuggestion() {
  monitorRejected = true;
  document.getElementById('monitorNotification').classList.remove('show');
}
window._stopMonitorPermanent = function() {
  monitorStopped = true;
  stopMonitor();
  document.getElementById('monitorNotification').classList.remove('show');
  var btn = document.getElementById('btnMonitor');
  btn.textContent = '已停止监测';
  btn.disabled = true;
};

// 判断是否为当天
function checkIfToday(dateStr) {
  if (!dateStr) return false;
  var d = dateStr.replace(/年|月/g, '-').replace(/日/g, '');
  var today = new Date();
  var todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  var parts = d.split('-');
  if (parts.length === 3) {
    return parts[0] + '-' + parts[1].padStart(2,'0') + '-' + parts[2].padStart(2,'0') === todayStr;
  }
  return d === todayStr;
}

document.addEventListener('DOMContentLoaded', function checkSharedTrip() {
  try {

  if (!shareId) return;
  // 有分享参数，加载分享行程
  var homePage = document.getElementById('homePage');
  var overviewPage = document.getElementById('overviewPage');

  if (overviewPage) overviewPage.style.display = 'none';
  tripPage.style.display = 'block';
  tripPage.style.position = 'relative';
  // 显示加载遮罩（不替换innerHTML，保留子元素结构）
  if (overlay) {
    overlay.style.display = 'flex';
    overlayContent.innerHTML = '<div class="loading-icon">⏳</div><div class="loading-text">正在加载分享行程...</div>';
  }
  fetch(API + '/api/shared-trip/' + shareId)
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (!data.success || !data.data) {
        if (overlay) {
          overlayContent.innerHTML = '<div class="share-error-icon">🔗</div><div class="loading-text">分享链接不存在或已过期</div><button class="share-back-btn" onclick="goBackFromShare()">返回首页</button>';
        } else {

        }
        return;
      }
      tripData = data.data;
      window._isReadonly = true;
      renderTrip();
      disableControlsForShared();
      // 隐藏加载遮罩
      if (overlay) overlay.style.display = 'none';
    })
    .catch(function(e) {

        overlayContent.innerHTML = '<div class="share-error-icon">❌</div><div class="loading-text">加载失败，请检查网络后重试</div><button class="share-back-btn" onclick="goBackFromShare()">返回首页</button>';

      }
    });
  } catch(e) { console.warn('分享链接检查失败:', e); }
});

      <button class="modal-btn cancel" onclick="cancelCity()">取消</button>
      <button class="modal-btn ok" onclick="confirmCity()">确定</button>
    </div>
  </div>
</div>
<script>
// 异步加载高德地图 SDK，避免阻塞页面渲染
(function loadAmap() {
  var s = document.createElement('script');
  s.src = 'https://webapi.amap.com/maps?v=2.0&key=a0c3b637da468b7b66c5f4dbaa5d676b';
  s.onerror = function() { console.warn('高德地图 SDK 加载失败，地图功能不可用'); };
  document.head.appendChild(s);
})();
</script>
